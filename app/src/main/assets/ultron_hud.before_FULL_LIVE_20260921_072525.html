<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,
      minimum-scale=0.25,maximum-scale=4.0,user-scalable=yes">

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:auto;
    background:#000;
}

#stage{
    position:relative;
    width:1536px;
    height:1025px;
    flex:none;
    transform-origin:0 0;
}

#reference{
    position:absolute;
    left:0;
    top:0;
    width:1536px;
    height:1025px;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
}

/* LIVE DATA REPLACEMENT LAYER
   Reference image remains the master design.
   These fields cover only the original demo values.
*/
#systemData{
    position:absolute;
    inset:0;
    pointer-events:none;
    font-family:Arial,sans-serif;
    font-weight:bold;
    color:#e7e9ec;
    text-shadow:0 0 5px rgba(0,0,0,.95);
}

.liveValue{
    position:absolute;
    white-space:nowrap;
    text-align:center;
    pointer-events:none;
}

/* ===== TOP SYSTEM STRIP: replace demo values only ===== */
#topBattery{
    left:1172px;
    top:78px;
    width:58px;
    font:12px Arial,sans-serif;
}

#topBrightness{
    left:1247px;
    top:78px;
    width:62px;
    font:12px Arial,sans-serif;
}

#topNetwork{
    left:1324px;
    top:78px;
    width:55px;
    font:12px Arial,sans-serif;
}

#topTime{
    left:1380px;
    top:78px;
    width:70px;
    font:12px Arial,sans-serif;
}

/* ===== RIGHT SYSTEM STATUS PANEL ===== */
#statusBatteryLarge{
    left:1240px;
    top:476px;
    width:72px;
    font:24px Arial,sans-serif;
}

#statusBattery{
    left:1430px;
    top:438px;
    width:45px;
    font:13px Arial,sans-serif;
    text-align:right;
}

#statusBrightness{
    left:1430px;
    top:474px;
    width:45px;
    font:13px Arial,sans-serif;
    text-align:right;
}

#statusNetwork{
    left:1430px;
    top:511px;
    width:45px;
    font:13px Arial,sans-serif;
    text-align:right;
}

#statusTime{
    left:1400px;
    top:548px;
    width:75px;
    font:12px Arial,sans-serif;
    text-align:right;
}

/* ===== BOTTOM-LEFT SYSTEM VALUES ===== */
#bottomCpu{
    left:332px;
    top:866px;
    width:48px;
    font:12px Arial,sans-serif;
    text-align:right;
}

#bottomMemory{
    left:332px;
    top:894px;
    width:48px;
    font:12px Arial,sans-serif;
    text-align:right;
}

#bottomNetwork{
    left:332px;
    top:922px;
    width:48px;
    font:12px Arial,sans-serif;
    text-align:right;
}

/* Transparent animated AI CORE layer */
#coreAnimation{
    position:absolute;
    left:570px;
    top:310px;
    width:360px;
    height:360px;
    border-radius:50%;
    overflow:visible;
    pointer-events:none;
}

/* soft rotating energy field */
.coreRing{
    position:absolute;
    left:50%;
    top:50%;
    width:100%;
    height:100%;
    border-radius:50%;
    box-sizing:border-box;
    transform:translate(-50%,-50%);
}

.coreRing.r1{
    width:92%;
    height:92%;
    border:2px solid transparent;
    border-top-color:rgba(255,150,45,.95);
    border-right-color:rgba(255,90,15,.65);
    filter:drop-shadow(0 0 7px rgba(255,110,20,.7));
    animation:coreSpin1 2.4s linear infinite;
}

.coreRing.r2{
    width:78%;
    height:78%;
    border:2px solid transparent;
    border-bottom-color:rgba(255,205,120,.9);
    border-left-color:rgba(255,100,20,.75);
    filter:drop-shadow(0 0 6px rgba(255,120,20,.65));
    animation:coreSpin2 2.0s linear infinite reverse;
}

.coreRing.r3{
    width:62%;
    height:62%;
    border:1px solid transparent;
    border-top-color:rgba(255,230,180,.95);
    border-bottom-color:rgba(255,100,20,.8);
    filter:drop-shadow(0 0 5px rgba(255,160,50,.7));
    animation:coreSpin3 1.7s linear infinite;
}

/* moving light arcs */
.coreRing.r4{
    width:86%;
    height:86%;
    border:3px dashed rgba(255,125,25,.45);
    opacity:.7;
    animation:coreSpin4 3s linear infinite reverse;
}

@keyframes coreSpin1{
    from{transform:translate(-50%,-50%) rotate(0deg);}
    to{transform:translate(-50%,-50%) rotate(360deg);}
}

@keyframes coreSpin2{
    from{transform:translate(-50%,-50%) rotate(0deg);}
    to{transform:translate(-50%,-50%) rotate(360deg);}
}

@keyframes coreSpin3{
    from{transform:translate(-50%,-50%) rotate(0deg);}
    to{transform:translate(-50%,-50%) rotate(360deg);}
}

@keyframes coreSpin4{
    from{transform:translate(-50%,-50%) rotate(0deg);}
    to{transform:translate(-50%,-50%) rotate(360deg);}
}

#controls{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.hotspot{
    position:absolute;
    border:0;
    padding:0;
    margin:0;
    background:transparent;
    pointer-events:auto;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.hotspot:active{
    background:rgba(255,120,20,.10);
}

#home{
    left:45px;
    top:170px;
    width:170px;
    height:70px;
}

#voice{
    left:650px;
    top:115px;
    width:120px;
    height:120px;
}

#camera{
    left:500px;
    top:850px;
    width:100px;
    height:70px;
}

#files{
    left:850px;
    top:850px;
    width:100px;
    height:70px;
}

#settings{
    right:45px;
    bottom:95px;
    width:120px;
    height:70px;
}

#prompt{
    position:absolute;
    left:455px;
    bottom:115px;
    width:620px;
    height:52px;
    opacity:0;
    pointer-events:auto;
}

#zoomInfo{
    position:fixed;
    left:8px;
    bottom:8px;
    z-index:20;
    padding:5px 9px;
    border-radius:6px;
    background:rgba(0,0,0,.65);
    color:#aaa;
    font:11px Arial;
    pointer-events:none;
}
</style>
</head>

<body>

<div id="stage">

    <img id="reference"
         src="ultron_reference.png"
         draggable="false">

    <div id="systemData">

        <!-- TOP SYSTEM STATUS: original reference positions -->
        <div id="topBattery" class="liveValue">--%</div>
        <div id="topBrightness" class="liveValue">--%</div>
        <div id="topNetwork" class="liveValue">--</div>
        <div id="topTime" class="liveValue">--</div>

        <!-- RIGHT SYSTEM STATUS PANEL -->
        <div id="statusBatteryLarge" class="liveValue">--%</div>
        <div id="statusBattery" class="liveValue">--%</div>
        <div id="statusBrightness" class="liveValue">--%</div>
        <div id="statusNetwork" class="liveValue">--</div>
        <div id="statusTime" class="liveValue">--</div>

        <!-- BOTTOM LEFT SYSTEM PANEL -->
        <div id="bottomCpu" class="liveValue">--%</div>
        <div id="bottomMemory" class="liveValue">--%</div>
        <div id="bottomNetwork" class="liveValue">--</div>
    </div>

    <div id="coreAnimation" aria-hidden="true">
        <div class="coreRing r1"></div>
        <div class="coreRing r2"></div>
        <div class="coreRing r3"></div>
        <div class="coreRing r4"></div>
    </div>

    <div id="controls">

        <button id="home"
                class="hotspot"
                onclick="command('home')"></button>

        <button id="voice"
                class="hotspot"
                onclick="command('voice')"></button>

        <button id="camera"
                class="hotspot"
                onclick="command('camera')"></button>

        <button id="files"
                class="hotspot"
                onclick="command('file')"></button>

        <button id="settings"
                class="hotspot"
                onclick="command('settings')"></button>

        <input id="prompt"
               aria-label="ULTRON command"
               onkeydown="if(event.key==='Enter')sendCommand()">

    </div>
</div>

<div id="zoomInfo">ZOOM 100%</div>

<script>

function setSystemData(
    battery,
    brightness,
    network,
    time,
    cpu,
    memory
){
    const b = battery || "--%";
    const br = brightness || "--%";
    const n = network || "--";
    const t = time || "--";
    const c = cpu || "--%";
    const m = memory || "--%";

    document.getElementById("topBattery").textContent = b;
    document.getElementById("topBrightness").textContent = br;
    document.getElementById("topNetwork").textContent = n;
    document.getElementById("topTime").textContent = t;

    document.getElementById("statusBatteryLarge").textContent = b;
    document.getElementById("statusBattery").textContent = b;
    document.getElementById("statusBrightness").textContent = br;
    document.getElementById("statusNetwork").textContent = n;
    document.getElementById("statusTime").textContent = t;

    document.getElementById("bottomCpu").textContent = c;
    document.getElementById("bottomMemory").textContent = m;
    document.getElementById("bottomNetwork").textContent = n;
}

function command(value){
    if(window.Android && Android.command){
        Android.command(value);
    }
}

function sendCommand(){
    const input=document.getElementById("prompt");
    const value=input.value.trim();

    if(!value) return;

    if(window.Android && Android.ask){
        Android.ask(value);
    }

    input.value="";
}

function updateZoom(){
    const stage=document.getElementById("stage");
    const width=stage.getBoundingClientRect().width;
    const zoom=(width/1536)*100;

    document.getElementById("zoomInfo").textContent=
        "ZOOM "+Math.round(zoom)+"%";
}

window.addEventListener("resize",updateZoom);
updateZoom();

</script>

</body>
</html>
